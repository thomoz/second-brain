[project]
name = "ai-resistant-moat-scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "my-trader",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
]

[tool.uv.sources]
my-trader = { workspace = true }

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0", "ruff>=0.2.0", "mypy>=1.8.0"]

[tool.pytest.ini_options]
testpaths = ["ai_resistant_moat_scanner/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_resistant_moat_scanner"]
