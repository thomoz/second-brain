[project]
name = "briefs-finance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "rich>=13.0.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.2.0", "mypy>=1.8.0", "pytest-mock>=3.12.0"]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "scripts/inspect_holdings.py",
    "scripts/inspect_monthly.py",
    "scripts/update_plan.py",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
